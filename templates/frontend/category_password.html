<!DOCTYPE HTML>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('blog-theme-mode') || 'light';
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = mode === 'dark' ? 'dark' : (mode === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
                document.documentElement.setAttribute('data-theme-mode', mode);
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme-mode', 'light');
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <title>请输入访问密码 - {{.Site.Title}}</title>
    <link rel="stylesheet" href="{{.Site.ThemeBase}}/normalize.css">
    <link rel="stylesheet" href="{{.Site.ThemeBase}}/grid.css">
    <link rel="stylesheet" href="{{.Site.ThemeBase}}/style.css">
    <link rel="stylesheet" href="{{.Site.ThemeBase}}/go-custom.css">
    <link rel="stylesheet" href="{{.Site.ThemeBase}}/css/font-awesome.min.css">
    <style>
        :root,
        :root[data-theme='dark'] {
            --primary-color: {{.Site.Skin.PrimaryColor}};
            --primary-hover: {{.Site.Skin.PrimaryHover}};
            --success-color: {{.Site.Skin.SuccessColor}};
            --text-primary: {{.Site.Skin.TextPrimary}};
            --text-secondary: {{.Site.Skin.TextSecondary}};
            --text-muted: {{.Site.Skin.TextMuted}};
            --bg-primary: {{.Site.Skin.BgPrimary}};
            --bg-secondary: {{.Site.Skin.BgSecondary}};
            --bg-accent: {{.Site.Skin.BgAccent}};
            --border-light: {{.Site.Skin.BorderLight}};
            --header-bg: {{.Site.Skin.HeaderBg}};
            --theme-btn-hover-bg: {{.Site.Skin.ThemeBtnHoverBg}};
            --theme-btn-active-bg: {{.Site.Skin.ThemeBtnActiveBg}};
            --radius: {{.Site.Skin.Radius}};
            --layout-container-max: {{.Site.Skin.LayoutContainerMax}};
            --layout-container-pad: {{.Site.Skin.LayoutContainerPad}};
            --layout-column-gap: {{.Site.Skin.LayoutColumnGap}};
            --layout-page-padding: {{.Site.Skin.LayoutPagePadding}};
            --layout-post-padding: {{.Site.Skin.LayoutPostPadding}};
            --layout-widget-padding: {{.Site.Skin.LayoutWidgetPadding}};
        }

        .category-password-panel {
            max-width: 420px;
            margin: 80px auto;
            padding: 28px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            background: var(--bg-primary);
        }

        .category-password-panel h1 {
            margin-top: 0;
            font-size: 22px;
        }

        .category-password-panel p {
            color: var(--text-secondary);
        }

        .category-password-panel input {
            width: 100%;
            box-sizing: border-box;
            margin: 12px 0;
            padding: 10px 12px;
        }

        .category-password-panel .message {
            color: #dc2626;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div id="body">
        <div class="container">
            <div class="category-password-panel">
                <h1><i class="fas fa-lock"></i> 请输入访问密码</h1>
                <p>分类“{{.Category.Name}}”已启用密码保护。</p>
                {{if .Message}}<p class="message">{{.Message}}</p>{{end}}
                <form method="post" action="/blog/index.php/category/{{.Category.Slug}}/password">
                    <input type="hidden" name="next" value="{{.Next}}">
                    <input type="password" name="password" required autofocus placeholder="访问密码">
                    <button type="submit" class="submit">进入分类</button>
                </form>
            </div>
        </div>
    </div>
    <script src="{{.Site.ThemeBase}}/js/theme-mode.js"></script>
    {{.Site.FooterCode}}
</body>

</html>
