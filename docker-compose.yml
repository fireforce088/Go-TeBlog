services:
  go-teblog:
    build: .
    image: go-teblog:v0.1.5
    container_name: go-teblog
    restart: unless-stopped
    ports:
      - "8190:8190"
    environment:
      TZ: Asia/Shanghai
      GIN_MODE: release
      INIT_ADMIN_USER: admin
      INIT_ADMIN_PASSWORD: admin
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-blog-images}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
      IMAGE_LOCALIZE_ENABLED: "true"
      IMAGE_LOCALIZE_MAX_SIZE_MB: "10"
      IMAGE_LOCALIZE_TIMEOUT_SEC: "15"
      IMAGE_LOCALIZE_DIR: "uploads/images"
      IMAGE_SEARCH_ENABLED: "true"
      IMAGE_SEARCH_WORKER_URL: "http://100.119.183.123:8900"
    volumes:
      - ./data:/data
